let lastIndex = -1;
let currentChallenge = null;

const COUNTER_URL="https://abacus.jasoncameron.dev";
const COUNTER_NAMESPACE="thingsicantry_7k4p9m";
const COUNTER_KEY="random_challenges_3x8q2v";

async function loadTryCount(){try{const r=await fetch(`${COUNTER_URL}/get/${COUNTER_NAMESPACE}/${COUNTER_KEY}`,{cache:"no-store"});if(!r.ok)throw Error();const d=await r.json();document.getElementById("tryCount").textContent=Number(d.value||0).toLocaleString()}catch(e){console.warn("Could not load counter",e)}}
async function incrementTryCount(){try{const r=await fetch(`${COUNTER_URL}/hit/${COUNTER_NAMESPACE}/${COUNTER_KEY}`,{cache:"no-store"});if(!r.ok)throw Error();const d=await r.json();document.getElementById("tryCount").textContent=Number(d.value||0).toLocaleString()}catch(e){console.warn("Could not update counter",e)}}

function randomTry(countClick=false) {
  let i;
  do {
    i = Math.floor(Math.random() * challenges.length);
  } while (i === lastIndex && challenges.length > 1);

  lastIndex = i;
  currentChallenge = challenges[i];

  document.getElementById("category").textContent = currentChallenge[0];
  document.getElementById("challenge").textContent = currentChallenge[1];
  document.getElementById("hint").textContent = currentChallenge[2];
  if (countClick) incrementTryCount();
}

function copyChallenge() {
  if (!currentChallenge) randomTry();

  const text = currentChallenge[1] + " — " + currentChallenge[2];

  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.querySelector(".secondary");
      const old = btn.textContent;
      btn.textContent = "✓ Copied!";
      setTimeout(() => btn.textContent = old, 1200);
    });
  }
}
